<!doctype html>
<html lang="ar" dir="rtl" style="background-color: #09090b; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/jpeg" href="/src/assets/images/ep_logo_icon_1785977837196.jpg" />
    <link rel="apple-touch-icon" href="/src/assets/images/ep_logo_icon_1785977837196.jpg" />
    <title>بوابة النخبة للرياضة والسينما | Elite Sports & Cinema Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.fotmob.com" />
    <style>
      /* Global hardware acceleration & smooth rendering optimizations */
      *, *::before, *::after {
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        background-color: #09090b;
        margin: 0;
        padding: 0;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        scroll-behavior: smooth;
      }
      img {
        content-visibility: auto;
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-red-500 selection:text-white">
    <div id="root">
      <style>
        .initial-loader-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background-color: #09090b;
          color: #f4f4f5;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .initial-loader-spinner {
          width: 44px;
          height: 44px;
          border: 3.5px solid rgba(239, 68, 68, 0.15);
          border-top-color: #ef4444;
          border-radius: 50%;
          animation: safariSpin 0.65s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }
        @keyframes safariSpin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div class="initial-loader-container">
        <div class="initial-loader-spinner"></div>
        <p style="margin-top: 18px; font-size: 13px; font-weight: 800; letter-spacing: 0.5px; color: #a1a1aa;">جاري التحميل السريع...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
